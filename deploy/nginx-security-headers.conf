# ============================================================
# Header di sicurezza per paparazzoparrucchieri.it
# ============================================================
# Come applicare sul VPS:
#   1. Copiare questo file:
#        scp deploy/nginx-security-headers.conf root@188.245.216.184:/etc/nginx/snippets/
#   2. Nel server block HTTPS (porta 443) di
#        /etc/nginx/sites-available/  (es. www.paparazzoparrucchieri.it)
#      aggiungere, dentro il blocco `server { ... }`:
#        include /etc/nginx/snippets/nginx-security-headers.conf;
#   3. Testare e ricaricare:
#        nginx -t && systemctl reload nginx
#
# NB: usare `always` per inviare gli header anche sulle risposte di errore.
# ============================================================

# HSTS - forza HTTPS per 2 anni, includendo i sottodomini.
# Inserire solo dopo aver verificato che TUTTI i sottodomini siano in HTTPS.
add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

# Impedisce il MIME-sniffing del browser.
add_header X-Content-Type-Options "nosniff" always;

# Protegge da clickjacking (solo iframe dello stesso dominio).
add_header X-Frame-Options "SAMEORIGIN" always;

# Limita le informazioni inviate nell'header Referer.
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# Disabilita feature del browser non utilizzate.
add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=()" always;

# Content Security Policy.
# Allineata alle risorse del sito: Google Fonts, Google Analytics/Tag Manager,
# WhatsApp e gli script inline di Next.js (richiedono 'unsafe-inline').
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com https://www.google-analytics.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https: blob:; connect-src 'self' https://www.google-analytics.com https://region1.google-analytics.com; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none'; upgrade-insecure-requests;" always;

# Rimuove la versione del server nelle risposte (riduce il fingerprinting).
server_tokens off;

# NB: per nascondere l'header `X-Powered-By: Next.js` aggiungere nel
# next.config.js dell'app:  poweredByHeader: false
